# Copy once to VPS:
#   sudo cp deploy/nginx/conf.d/light-islam-rate-limit.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Free nginx rate limiting (no extra service).

limit_req_zone $binary_remote_addr zone=light_islam_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=light_islam_devices:10m rate=20r/m;
