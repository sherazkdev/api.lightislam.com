# /etc/nginx/sites-available/api.lightislam.com
# sudo ln -s /etc/nginx/sites-available/api.lightislam.com /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# SSL: sudo certbot --nginx -d api.lightislam.com

upstream light_islam_reminder_api {
    server 127.0.0.1:3022;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.lightislam.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://light_islam_reminder_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

# After certbot, a second server { listen 443 ssl; ... } block is added automatically.
